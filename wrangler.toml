name = "vector-flow"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Pages deployment — run `pnpm pages:deploy` to ship to Cloudflare Pages.
# ---------------------------------------------------------------------------
pages_build_output_dir = ".vercel/output/static"

# ---------------------------------------------------------------------------
# D1 Database
# ---------------------------------------------------------------------------
# DB stores the relational data for projects and discovery.
# Create the database with: pnpm dlx wrangler d1 create vectorflow
# Then update the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "vectorflow"
database_id = "0fd95ffb-7f5e-440f-93c8-227e4104e391"